name: CI

# Optional maintainer check. Local release receipts are the publication gate.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.3
          cache: npm

      - name: Install development dependencies
        run: npm ci --ignore-scripts

      - name: Run offline checks
        run: npm run check

      - name: Audit bilingual book sources
        run: |
          python3 -m venv .tmp/book-audit-env
          .tmp/book-audit-env/bin/python -m pip install -r tools/books/requirements.txt
          node tools/books/validate-pstack-book.mjs --complete
          .tmp/book-audit-env/bin/python tools/books/audit-source.py
          .tmp/book-audit-env/bin/python tests/pstack-book-audit.test.py
